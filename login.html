<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Login | SIAP Merdeka</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="assets/favicon.ico?v=2" type="image/x-icon" />
</head>
<body class="auth-page">

  <main class="login-container fade-in">
    <div class="login-header">
      <img src="assets/img/logo-new.png" alt="Logo SMA" class="logo" />
      <h2>Selamat Datang</h2>
      <p>Simulasi Login Siswa SMA</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="nisn">NISN</label>
        <input type="text" id="nisn" placeholder="Masukkan NISN" required />
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan Password" required />
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        Masuk
      </button>

      <div style="margin-top: 1.5rem; font-size: 0.9em; color: #555;">
        <strong>Akun Dummy (Password: password):</strong><br>
        10001 (Budi - Kls 10)<br>
        10002 (Siti - Kls 10)<br>
        11001 (Andi - Kls 11 IPA)<br>
        11002 (Dewi - Kls 11 IPA)<br>
        11003 (Rina - Kls 11 IPS)<br>
        11004 (Agus - Kls 11 IPS)
      </div>
    </form>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
